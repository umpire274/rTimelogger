[package]
name = "rtimelogger"
version = "0.9.1"
edition = "2024"
authors = ["Umpire274 <umpire274@gmail.com>"]
description = "A simple cross-platform CLI tool to track working hours, lunch breaks, and calculate surplus time"
homepage = "https://github.com/umpire274/rTimelogger"
repository = "https://github.com/umpire274/rTimelogger"
license = "MIT"
readme = "README.md"
keywords = ["timelog", "work-tracking", "cli", "productivity", "sqlite"]
categories = ["command-line-utilities", "date-and-time", "database"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md"
]

[build-dependencies]
winresource = "0.1.28"

[package.metadata.winresource]
OriginalFilename = "rtimelogger.exe"
FileDescription = "rTimelogger - Time Tracking Utility"
ProductName = "rTimelogger"
ProductVersion = "0.9.1"
LegalCopyright = "© 2025 Alessandro Maestri"
Icon = "res/rtimelogger.ico"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.6", features = ["derive"] }
predicates = "3.1.4"
assert_cmd = "2.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.33"
serde_json = "1.0.151"
zip = "8.6.0"
flate2 = "1.1.10"
tar = "0.4.46"
csv = "1.4.0"
rust_xlsxwriter = "0.99.0"
unicode-width = "0.2.2"
pdf-writer = "0.15.0"
dirs = "6.0.0"
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
time = "0.3.55"
ansi_term = "0.12.1"
regex = "1.13.1"
textwrap = "0.16.2"
